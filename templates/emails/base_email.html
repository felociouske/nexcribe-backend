<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block subject %}Nexcribe{% endblock %}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f4f8;
      color: #1a2740;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper { max-width: 600px; margin: 40px auto; padding: 0 16px 40px; }
    .header {
      background: linear-gradient(135deg, #0d1b2e 0%, #1e3a5f 60%, #0a7c5c 100%);
      border-radius: 16px 16px 0 0;
      padding: 32px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 10px;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #fff;
      letter-spacing: -0.03em; flex-shrink: 0;
    }
    .logo-text { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: -0.03em; }
    .logo-sub  { color: rgba(255,255,255,0.5); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
    .body {
      background: #ffffff;
      padding: 40px;
    }
    .footer {
      background: #f8fafc;
      border-radius: 0 0 16px 16px;
      padding: 24px 40px;
      border-top: 1px solid #e8edf3;
      text-align: center;
    }
    .footer p { font-size: 12px; color: #94a3b8; line-height: 1.7; }
    .footer a { color: #0a7c5c; text-decoration: none; }

    h1 { font-size: 22px; font-weight: 700; color: #0d1b2e; margin-bottom: 8px; letter-spacing: -0.02em; }
    h2 { font-size: 16px; font-weight: 600; color: #0d1b2e; margin: 24px 0 12px; }
    p  { font-size: 15px; color: #3d5170; line-height: 1.7; margin-bottom: 14px; }
    .muted { font-size: 13px; color: #7a8fa6; }

    .badge {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .badge-green  { background: #dcfce7; color: #166534; }
    .badge-amber  { background: #fef3c7; color: #92400e; }
    .badge-red    { background: #fee2e2; color: #991b1b; }
    .badge-blue   { background: #dbeafe; color: #1e40af; }
    .badge-teal   { background: #ccfbf1; color: #0f5b47; }

    .summary-table {
      width: 100%; border-collapse: collapse;
      margin: 20px 0; border-radius: 10px; overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .summary-table th {
      background: #f1f5f9; text-align: left;
      padding: 10px 16px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; color: #64748b;
    }
    .summary-table td {
      padding: 12px 16px; font-size: 14px; color: #1a2740;
      border-top: 1px solid #e2e8f0;
    }
    .summary-table tr:nth-child(even) td { background: #f8fafc; }
    .summary-table .val { font-weight: 600; text-align: right; }

    .cta-btn {
      display: inline-block;
      background: linear-gradient(135deg, #0d7c5c, #0a6b4e);
      color: #fff !important; text-decoration: none;
      padding: 14px 32px; border-radius: 10px;
      font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
      margin: 8px 0;
    }
    .highlight-box {
      background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
      border: 1px solid #bbf7d0; border-radius: 12px;
      padding: 20px 24px; margin: 20px 0;
    }
    .highlight-box .amount {
      font-size: 28px; font-weight: 800; color: #0a7c5c; letter-spacing: -0.03em;
    }
    .highlight-box .amount-sub { font-size: 13px; color: #4a7c6f; margin-top: 2px; }
    .divider { border: none; border-top: 1px solid #e8edf3; margin: 24px 0; }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: #64748b; }
    .info-row .value { font-weight: 600; color: #0d1b2e; }
    .feature-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0;
    }
    .feature-item {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 14px 16px;
    }
    .feature-item .fi-icon { font-size: 20px; margin-bottom: 6px; }
    .feature-item .fi-title { font-size: 13px; font-weight: 600; color: #0d1b2e; }
    .feature-item .fi-desc  { font-size: 12px; color: #64748b; margin-top: 2px; line-height: 1.5; }
    .step {
      display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start;
    }
    .step-num {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #0d7c5c, #1e3a5f);
      color: #fff; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .step-content .step-title { font-size: 14px; font-weight: 600; color: #0d1b2e; margin-bottom: 2px; }
    .step-content .step-desc  { font-size: 13px; color: #64748b; line-height: 1.5; }
    .txn-code {
      font-family: 'Courier New', monospace; font-size: 13px;
      background: #f1f5f9; padding: 3px 8px; border-radius: 5px;
      color: #0d1b2e; font-weight: 600; letter-spacing: 0.04em;
    }
    .status-banner {
      border-radius: 10px; padding: 16px 20px; margin: 16px 0;
      display: flex; align-items: center; gap: 14px;
    }
    .status-banner.approved { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .status-banner.pending  { background: #fffbeb; border: 1px solid #fde68a; }
    .status-banner.rejected { background: #fff1f2; border: 1px solid #fecdd3; }
    .status-icon { font-size: 24px; flex-shrink: 0; }
    .status-title { font-size: 15px; font-weight: 700; }
    .status-title.approved { color: #166534; }
    .status-title.pending  { color: #92400e; }
    .status-title.rejected { color: #991b1b; }
    .status-desc  { font-size: 13px; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="logo-mark">N</div>
    <div>
      <div class="logo-text">Nexcribe</div>
      <div class="logo-sub">Earn · Write · Transcribe · Play</div>
    </div>
  </div>

  <div class="body">
    {% block content %}{% endblock %}
  </div>

  <div class="footer">
    <p>
      You're receiving this email because you have an account on
      <a href="{{ site_url }}">nexcribe.com</a>.<br />
      Questions? Email us at <a href="mailto:{{ support_email }}">{{ support_email }}</a>
    </p>
    <p style="margin-top: 8px;">© 2025 Nexcribe Ltd. All rights reserved.</p>
  </div>
</div>
</body>
</html>
